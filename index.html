<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Work Brain 모바일 v3.1.3</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Work Brain">
<meta name="theme-color" content="#F2F4F8">
<style>
:root{
  --ink:#1D1D1F; --sub:#6E6E73; --faint:#A1A1A6; --line:rgba(60,60,67,.14);
  --glass:rgba(255,255,255,.72); --edge:rgba(255,255,255,.8);
  --blue:#0A84FF; --red:#FF3B30; --orange:#FF9500; --yellow:#FFC400; --green:#34C759; --purple:#AF52DE; --wait:#AEAEB2;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#F2F4F8}
html,body{margin:0;height:100%;width:100%;max-width:100%;color:var(--ink);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{max-width:100vw;overflow-x:hidden;background:
  radial-gradient(45% 30% at 15% 10%,rgba(10,132,255,.12),transparent 70%),
  radial-gradient(40% 30% at 90% 15%,rgba(175,82,222,.10),transparent 70%),
  radial-gradient(45% 35% at 80% 90%,rgba(48,176,199,.10),transparent 70%),#F2F4F8;
  display:flex;flex-direction:column;overflow:hidden}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#F2F2F7; --sub:#98989D; --faint:#6E6E73; --line:rgba(255,255,255,.12);
  --glass:rgba(28,28,30,.72); --edge:rgba(255,255,255,.08); }
  :root:not([data-theme="light"]) html,:root:not([data-theme="light"]) body{background:#0B0B0F}
}
button,input,textarea,select{font:inherit;color:inherit;min-width:0}
input,textarea,select{font-size:16px!important}
img,svg,canvas{max-width:100%}
button{cursor:pointer}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--shadow)}
header{display:flex;flex-direction:column;gap:6px;padding:8px 12px 10px;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(127,127,127,.12);border-radius:11px;padding:3px}
.hbtns .tbtn{padding:7px 4px;text-align:center;border-radius:9px;font-size:.82rem;letter-spacing:-.02em}
.logo{font-weight:700;letter-spacing:.16em;font-size:.7rem;color:var(--sub)}
.hbtns{display:flex;gap:4px}
.tbtn{background:transparent;border:0;border-radius:9px;padding:6px 10px;font-size:.8rem;color:var(--sub)}
.tbtn.on{background:var(--blue);color:#fff}
.sync{font-size:.68rem;color:var(--faint);padding:0 4px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
main.brainmode{overflow:hidden;padding:0;pointer-events:none}
body.space{background:radial-gradient(45% 38% at 20% 25%,rgba(70,60,190,.25),transparent 70%),radial-gradient(38% 30% at 82% 18%,rgba(150,50,160,.18),transparent 72%),radial-gradient(50% 42% at 72% 88%,rgba(20,90,150,.2),transparent 72%),#03040B!important}
:root[data-theme="dark"]{--ink:#E9ECF6;--sub:#9CA3BA;--faint:#6B7189;--line:rgba(255,255,255,.10);--glass:rgba(16,19,34,.62);--edge:rgba(255,255,255,.09)}
:root[data-theme="dark"] html,:root[data-theme="dark"] body{color:var(--ink)}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"] select{
  color-scheme:dark!important;
  background-color:#141827!important;
  color:#E9ECF6!important;
  border-color:rgba(255,255,255,.12)!important;
}
:root[data-theme="dark"] select option{
  background:#141827!important;
  color:#E9ECF6!important;
}
:root[data-theme="dark"] select optgroup{
  background:#0F1220!important;
  color:#9CA3BA!important;
}
:root[data-theme="dark"] select option:checked{
  background:#0A84FF!important;
  color:#FFFFFF!important;
}
#brain{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:3;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
#brain.on{display:block}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,rgba(242,244,248,.88) 45%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bottom{background:linear-gradient(transparent,rgba(11,11,15,.92) 45%)}}
.bottom .omni{margin:0}
.icon.speaking{background:rgba(52,199,89,.18);color:var(--green)}
.braintip{position:fixed;left:50%;transform:translateX(-50%);top:calc(92px + env(safe-area-inset-top,0px));z-index:6;white-space:nowrap;
  font-size:.7rem;opacity:.85;color:var(--sub);background:var(--glass);backdrop-filter:blur(10px);padding:5px 12px;border-radius:99px;border:1px solid var(--edge);display:none}
.braintip.on{display:block}
.wrap{width:100%;max-width:720px;min-width:0;margin:0 auto}
.omni{display:flex;gap:8px;align-items:flex-end;border-radius:16px;padding:10px 12px;margin:6px 0 12px}
.omni textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:1rem;min-height:38px;max-height:140px}
.icon{border:0;background:rgba(0,0,0,.05);border-radius:10px;width:36px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.icon.on{background:rgba(255,59,48,.16);color:var(--red)}
.send{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600;flex:none}
.card{border-radius:16px;padding:14px 16px;margin:10px 0}
.say{font-size:1rem;font-weight:600;margin:0 0 8px}
.sec{font-size:.72rem;font-weight:700;color:var(--sub);margin:12px 0 4px;letter-spacing:.02em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:.8rem;color:var(--sub)}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px;font-size:.88rem}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.danger{color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.d{font-size:.76rem;color:var(--sub)}
.raw{font-size:.76rem;color:var(--sub);margin:8px 0 0}
label.fld{display:block;font-size:.74rem;color:var(--sub);margin:8px 0 3px}
input,select,textarea.f{width:100%;background:rgba(127,127,127,.08);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.lamp{display:inline-flex;gap:3px;padding:3px 5px;border-radius:99px;background:#2C2C2E;vertical-align:middle}
.lamp i{width:7px;height:7px;border-radius:50%;background:#48484A;display:block}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:16px;border-radius:99px;background:rgba(127,127,127,.2);color:var(--sub);font-size:.6rem;font-weight:700;vertical-align:middle}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 4px}
.trow:active{background:rgba(127,127,127,.08)}
.ttl{font-size:.95rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{grid-column:2/4;font-size:.75rem;color:var(--sub)}
.ck{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line);font-size:.9rem}
.ck input{width:20px;height:20px;accent-color:var(--blue);flex:none;margin-top:1px}
.ck.done span{color:var(--sub);text-decoration:line-through}
.kind{font-weight:700;font-size:.76rem}
.k지시,.k피드백{color:#C76A00}.k조치,.k완료{color:#248A3D}.k보고{color:#0A64D6}.k위임{color:#8E44C8}.k정정{color:var(--orange)}
details.rec{border-bottom:1px solid var(--line)}
details.rec>summary{list-style:none;padding:9px 2px;cursor:pointer}
details.rec>summary::-webkit-details-marker{display:none}
.rhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rsum{display:block;margin-top:2px;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.rec[open] .rsum{display:none}
.rbody{padding:0 2px 12px;font-size:.92rem;white-space:pre-wrap}
.flow{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:6px 0}
.fl{font-size:.7rem;border:1px solid var(--line);border-radius:8px;padding:2px 7px;color:var(--sub)}
.turn{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px}
.turn.mine{background:rgba(255,149,0,.18);color:#B25E00}
.turn.their{background:rgba(142,142,147,.18);color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:34px 8px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  padding:9px 16px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:0;z-index:10}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.25);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.sheet{width:100%;max-width:640px;min-width:0;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px;max-height:84vh}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px}
</style>
</head>
<body>
<header class="glass">
  <div class="hrow"><span class="logo">WORK BRAIN <span style="letter-spacing:0;font-weight:500">v3.1.3</span></span><span class="sync" id="sync">연결 중…</span></div>
  <div class="hbtns" style="grid-template-columns:repeat(4,1fr)">
    <button class="tbtn on" data-tab="brain">뇌</button>
    <button class="tbtn" data-tab="home">오늘</button>
    <button class="tbtn" data-tab="list">업무</button>
    <button class="tbtn" data-tab="more">더보기</button>
  </div>
</header>
<main id="main"><div class="wrap">
  <div id="view"></div>
</div></main>
<canvas id="brain"></canvas>
<div class="braintip" id="braintip"></div>
<div class="bottom">
  <div class="omni glass">
    <textarea id="omni" rows="1" placeholder="찾거나 적어 보세요"></textarea>
    <button class="icon" id="mic" aria-label="말로 적기"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="icon" id="speak" aria-label="브리핑 읽어주기"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
    <button class="send" id="send">기록</button>
  </div>
</div>
<div class="modal" id="modal"><div class="sheet glass" id="sheet"></div></div>
<div class="toast glass" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const DAYS="일월화수목금토";
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=(ts,t=true)=>{const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]})`+(t?` ${pad(d.getHours())}:${pad(d.getMinutes())}`:"");};
const fmtFull=(ts,t=true)=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`+(t?` ${pad(d.getHours())}:${pad(d.getMinutes())}`:"");};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600);}

/* ---------- 해석 ---------- */
const KINDS=["지시","위임","조치","보고","피드백","협의","변경","완료","메모"];
const KIND_LABEL={지시:"지시받음",위임:"맡김",조치:"조치",보고:"보고",피드백:"피드백",협의:"협의",변경:"변경",완료:"완료",메모:"메모",정정:"정정",확인:"확인 메일"};
const CHANNELS=["","구두","메일","전화","메신저","결재","회의","공문","기타"];
const ROLES=["부센터장","센터장","사무국장","본부장","이사장","국장","재단","서울시","구청","주무관"];
const ALL_PERSON="전체";
function parseWhen(text,now=new Date()){
  const today=sod(now); let date=null,hasTime=false,h=null,mi=0; const spans=[]; let m;
  if((m=text.match(/(\d{1,2})\s*(?:\/|월\s*|\.\s*)(\d{1,2})\s*일?/))&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31){
    let y=today.getFullYear(); let d=new Date(y,+m[1]-1,+m[2]);
    if(d<addDays(today,-200)) d=new Date(y+1,+m[1]-1,+m[2]);
    date=d; spans.push(m[0]);
  }else if((m=text.match(/오늘|금일|아까|방금/))){date=today;spans.push(m[0]);}
  else if((m=text.match(/그저께|그제/))){date=addDays(today,-2);spans.push(m[0]);}
  else if((m=text.match(/어제|전날/))){date=addDays(today,-1);spans.push(m[0]);}
  else if((m=text.match(/내일|명일/))){date=addDays(today,1);spans.push(m[0]);}
  else if((m=text.match(/모레/))){date=addDays(today,2);spans.push(m[0]);}
  else if((m=text.match(/(이번\s*주|금주|다음\s*주|차주|지난\s*주)?\s*([일월화수목금토])요일/))){
    const tg=DAYS.indexOf(m[2]),cur=today.getDay(),mb=x=>(x+6)%7; let diff;
    if(m[1]&&/다음|차주/.test(m[1])) diff=7-mb(cur)+mb(tg);
    else if(m[1]&&/지난/.test(m[1])) diff=-7-mb(cur)+mb(tg);
    else if(m[1]) diff=mb(tg)-mb(cur); else diff=(tg-cur+7)%7;
    date=addDays(today,diff); spans.push(m[0]);
  }
  if((m=text.match(/(오전|오후)?\s*(\d{1,2})\s*시(?!간)(?:\s*(\d{1,2})\s*분|\s*(반))?/))){
    h=+m[2]; mi=m[3]?+m[3]:(m[4]?30:0);
    if(m[1]==="오후"&&h<12)h+=12;
    if(!m[1]&&h>=1&&h<=7)h+=12;
    if(h<=23&&mi<60){hasTime=true;spans.push(m[0]);}
  }
  if(hasTime&&!date) date=today;
  if(date&&hasTime){date=new Date(date);date.setHours(h,mi,0,0);}
  return {date,hasTime,spans};
}
function splitWhen(text,now=new Date()){
  const w=parseWhen(text,now); if(!w.date) return {due:null,occ:null,spans:w.spans};
  const dueWord=/까지|마감|기한|전까지|내로|이내/.test(text);
  const future=w.hasTime?w.date>now:sod(w.date)>sod(now);
  const v={date:w.date,hasTime:w.hasTime};
  return (dueWord||future)?{due:v,occ:null,spans:w.spans}:{due:null,occ:v,spans:w.spans};
}
function detectPeople(t,people){
  let to="",from="";
  const names=[...new Set([ALL_PERSON,...(people||[]),...ROLES])].sort((a,b)=>b.length-a.length);
  const q=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  let m=t.match(/@([가-힣A-Za-z0-9]+?)(?:에게|한테|께|님께)/); if(m) to=m[1];
  if(!to) for(const n of names) if(new RegExp(q(n)+"(?:님)?(?:에게|한테|께)").test(t)){to=n;break;}
  m=t.match(/@([가-힣A-Za-z0-9]+)/);
  if(m){const n=m[1].replace(/(에게|한테|께|님|이|가|은|는)$/,""); if(n!==to) from=n;}
  if(!from) for(const n of names) if(n!==to&&t.includes(n)){from=n;break;}
  return {from,to};
}
function detectKind(s,from,to){
  if(/^정정/.test(s)) return "정정";
  if(/보고함|보고했|보고 ?완료|말씀 ?드림|말씀 ?드렸|공유함|공유했|전달함|전달했|상신|결재 ?올림|회신함|회신했/.test(s)) return "보고";
  if(/(완료|끝냈|끝남|끝났|마침|마쳤|제출함|제출했|발송함|발송했|보냈|처리함|처리했|결재 ?남|결재 ?났)/.test(s)) return "완료";
  if(/(바뀌|바꿈|바꿨|변경|연기|미뤄|미뤘|앞당|취소|번복)/.test(s)) return "변경";
  const order=/지시|시킴|시켰|하라고|하래|해달라|요청|달라고|부탁|맡기|맡김|맡겼/.test(s);
  if(to&&!ROLES.includes(to)&&order) return "위임";
  if(order&&from&&from!=="나") return "지시";
  if(order&&to) return "위임";
  if(/회의|협의|논의|면담|통화/.test(s)) return "협의";
  if(from&&ROLES.includes(from)&&!/결과|받음|받았|줌|줬|왔/.test(s)) return "지시";
  return "조치";
}
function detectChannel(t){
  if(/메일|이메일/.test(t))return"메일"; if(/전화|통화/.test(t))return"전화";
  if(/카톡|메신저|문자|톡으로/.test(t))return"메신저"; if(/결재|기안|상신/.test(t))return"결재";
  if(/회의|면담/.test(t))return"회의"; if(/공문/.test(t))return"공문";
  if(/구두|말로|불러서|대면/.test(t))return"구두"; return"";
}
function cleanTitle(t,spans){
  let s=t; for(const sp of spans) s=s.replace(sp," ");
  s=s.replace(/@[가-힣A-Za-z0-9]+/g," ").replace(/(센터장|부센터장|국장|주무관)(님)?(이|가|께서|에게|한테|께)?/g," ")
   .replace(/(구두|메일|이메일|전화|카톡|메신저)(로|으로)?/g," ")

const STOP=/완료|끝냈|끝남|까지|오늘|내일|모레|어제|요일|다시|했음|했어|함|변경|연기|제출|보냈|처리|보고|지시|요청|센터장|구두|메일|전화|하라고|\?/g;

function dueInfo(t){

function flowOf(t){

}
function gapsOf(t){
  if(t.isGroup) return [];
  const g=[],now=Date.now(),day=864e5,es=entriesOf(t.id);
  const dirs=es.filter(e=>e.kind==="지시"||(e.kind==="피드백"&&e.fb==="수정 요청"));
  if(dirs.length){
    const last=dirs[dirs.length-1];
    const after=es.filter(e=>e.occurredAt>=last.occurredAt&&e!==last&&["조치","완료","보고","협의"].includes(e.kind));
    if(t.status!=="완료"&&!after.length&&now-last.occurredAt>2*day) g.push(`${last.kind==="피드백"?"수정 요청":"지시"} 후 조치 기록 없음 (${Math.floor((now-last.occurredAt)/day)}일)`);
  }
  if(es.some(e=>e.kind==="지시")&&t.status==="완료"&&!es.some(e=>e.kind==="보고")) g.push("완료했지만 보고 기록 없음");

    if(f.stage.code==="approved") g.push("승인됐지만 완료 기록 없음");
  }

}
const SIG={red:{c:"#FF3B30",t:"#D70015",l:"긴급"},yellow:{c:"#FFC400",t:"#A07800",l:"주의"},green:{c:"#34C759",t:"#248A3D",l:"순조"},wait:{c:"#AEAEB2",t:"#6E6E73",l:"대기"},done:{c:"#D1D1D6",t:"#8E8E93",l:"완료"}};
function signalOf(t){
  if(t.isGroup){
    const kids=tasks.filter(x=>x.parentId===t.id&&!x.isGroup);
    if(!kids.length) return {code:"wait",why:"하위 업무 없음"};
    const order=["red","yellow","green","wait","done"], ss=kids.map(signalOf);
    const worst=order.find(o=>ss.some(x=>x.code===o));
    return {code:worst,why:`하위 업무 ${ss.filter(x=>x.code===worst).length}건 ${SIG[worst].l}`};
  }
  if(t.status==="완료") return {code:"done",why:"완료 기록 있음"};
  const d=dueInfo(t), f=flowOf(t), now=Date.now();
  const mine=f.stage.turn!=="상대"&&t.status!=="대기";
  if(d&&d.past) return {code:"red",why:"기한 지남"};
  if(d&&d.diff<=1&&mine) return {code:"red",why:`기한 ${d.diff<=0?"오늘":"내일"} · 내 차례`};
  const g=gapsOf(t); if(g.length) return {code:"yellow",why:g[0]};
  if(d&&d.diff<=3&&mine) return {code:"yellow",why:`기한 ${d.diff}일 남음`};
  if(!mine) return {code:"wait",why:f.stage.text};
  if(now-lastAt(t)>7*864e5) return {code:"yellow",why:`${Math.floor((now-lastAt(t))/864e5)}일째 기록 없음`};
  return {code:"green",why:f.stage.text};
}
function lamp(t){
  const s=signalOf(t);
  if(s.code==="done") return `<span class="pill">완료</span>`;
  if(s.code==="wait") return `<span class="pill">대기</span>`;
  const on=k=>s.code===k?`style="background:${SIG[k].c};box-shadow:0 0 5px ${SIG[k].c}"`:"";
  return `<span class="lamp"><i ${on("red")}></i><i ${on("yellow")}></i><i ${on("green")}></i></span>`;
}

const ghHeaders=()=>({Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});

async function ghProbeAccess(){
  const owner=encodeURIComponent(GH.owner), repo=encodeURIComponent(GH.repo), branch=encodeURIComponent(GH.branch||"main");

    throw new Error(ghErr(rr.status));

async function ghGet(){

async function ghPut(obj,shaIn){

    content:btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(obj)))),
    sha:shaIn||undefined,branch:GH.branch||"main"});
  const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/contents/${GH_FILE}`,

function packUp(){

    entries:entries.map(e=>({...e,images:[],files:(e.files||[]).map(f=>({id:f.id,name:f.name,size:f.size,sha:f.sha,locked:f.locked,mail:f.mail?{subject:f.mail.subject,from:f.mail.from,date:f.mail.date,messageId:f.mail.messageId}:undefined}))})),

function unpack(r){
  if(!r||!Array.isArray(r.tasks)) return {nt:0,ne:0};
  const del={...(state.syncDeleted||{}),...(r.deleted||{})}; state.syncDeleted=del;
  let nt=0,ne=0;
  const tmap=new Map(tasks.map(t=>[t.id,t]));
  for(const raw of r.tasks||[]){
    const rt={...raw};
    if(rt.due&&typeof rt.due==="object"){ rt.dueHasTime=!!rt.due.hasTime; rt.due=new Date(rt.due.iso).getTime(); }
    if(del[rt.id]&&del[rt.id]>=(rt.updatedAt||0)) continue;
    const cur=tmap.get(rt.id);
    if(!cur){ tasks.push(rt); tmap.set(rt.id,rt); nt++; }
    else if((rt.updatedAt||0)>(cur.updatedAt||0)){ Object.assign(cur,rt); nt++; }
  }
  for(const [id,at] of Object.entries(del)){
    const i=tasks.findIndex(t=>t.id===id&&(t.updatedAt||0)<=at);
    if(i>=0){ tasks.splice(i,1); entries=entries.filter(e=>e.taskId!==id); }
  }
  const emap=new Map(entries.map(e=>[e.id,e]));
  for(const re0 of r.entries||[]){
    if(del[re0.taskId]) continue;
    const re={...re0,images:re0.images||[],files:re0.files||[]};
    const cur=emap.get(re.id);
    if(!cur){ entries.push(re); emap.set(re.id,re); ne++; }
    else{
      const rr=(re.rev||[]).length, cr=(cur.rev||[]).length;
      if(rr>cr||(rr===cr&&(re.at||0)>(cur.at||0)&&re.raw!==cur.raw)){ Object.assign(cur,re); ne++; }
      if((re.files||[]).length&&!(cur.files||[]).length) cur.files=re.files;
    }
  }

  for(const p of (r.people||[])) if(p&&p!=="나"&&p!==ALL_PERSON&&!people.includes(p)) people.push(p);

  for(const t of (r.tombs||[])) if(t&&t.id&&!tombMap.has(t.id)){ (state.tombs=state.tombs||[]).push(t); tombMap.set(t.id,t); }

}

    title:cleanTitle(f.text,w.spans),evidence:f.evidence,next:f.next,

function fbType(text){
  if(/승인|통과|컨펌|좋다고/.test(text))return"승인";
  if(/보류|중단|멈춰/.test(text))return"보류";
  if(/수정|다시|보완|반려|고쳐/.test(text))return"수정 요청";
  return"의견";
}
function splitFields(t){
  let text=t,next="",evidence="";
  let m=text.match(/근거\s*[:：]\s*(.+?)(?=\s*다음\s*[:：]|$)/);
  if(m){evidence=m[1].trim();text=text.replace(m[0]," ");}
  m=text.match(/다음\s*[:：]\s*(.+)$/);
  if(m){next=m[1].trim();text=text.slice(0,m.index);}
  return {text:text.replace(/\s+/g," ").trim(),next,evidence};
}

function readConfirm(){
  const p=pending; if(!p||!$("cBody")) return;

  if($("cFb")) p.fb=$("cFb").value;

async function applyPending(){
  readConfirm(); const p=pending;
  if(!p.body){ toast("내용을 적어 주세요."); return; }
  if(["지시","피드백"].includes(p.kind)&&(!p.from||p.from==="나")){ toast(p.kind==="지시"?"지시한 사람을 적어 주세요.":"피드백 준 사람을 적어 주세요."); return; }
  $("cOk").disabled=true;
  const now=Date.now();
  let t;
  if(p.isNew||!p.targetId){
    t={id:uid(),title:p.title||p.body.slice(0,30),status:"진행",isGroup:false,parentId:null,
       due:p.due?p.due.iso:null,dueHasTime:p.due?p.due.hasTime:false,items:[],nextAction:p.next||"",
       createdAt:now,updatedAt:now,completedAt:null};
  }else{
    t=byId(p.targetId);
    if(p.due&&p.due.iso!==t.due){ t.due=p.due.iso; t.dueHasTime=p.due.hasTime; }
    if(p.next) t.nextAction=p.next;
    if(p.kind==="완료"){ t.status="완료"; t.completedAt=now; }
    else if(t.status==="완료"&&["지시","조치","변경"].includes(p.kind)){ t.status="진행"; t.completedAt=null; }
  }
  const e={id:uid(),taskId:t.id,at:now,occurredAt:p.occ,occHasTime:true,raw:p.body,kind:p.kind,
    from:p.from||"나",to:p.to||"",channel:p.channel,evidence:p.evidence,fb:p.kind==="피드백"?(p.fb||"의견"):""};
  try{ await saveTask(t); await saveEntry(e); }
  catch(err){ toast("저장하지 못했습니다: "+(err.message||err.code||"")); $("cOk").disabled=false; return; }
  pending=null; closeSheet(); $("omni").value=""; $("omni").style.height="auto";
  toast(p.kind==="보고"?`${flowOf(t).reports}차 보고를 기록했습니다.`:"기록했습니다.");
  openTaskId=t.id; tab="list"; render();
}

    else if(n.cosmic==="subsystem"){amp=2.7;speed=.000125;}
    else if(n.cosmic==="star"){amp=n.hub?.9:2.0;speed=.000095;}
    else if(n.cosmic==="cluster"){amp=1.8;speed=.000085;}

  }
}

  ctx.globalAlpha=1;const order=[...B.nodes].sort((a,b)=>P.get(b).z-P.get(a).z),priv=document.body.classList.contains("privacy"),boxes=[];const fits=(x,y,w,h)=>{for(const b of boxes)if(Math.abs(x-b.x)*2<(w+b.w)&&Math.abs(y-b.y)*2<(h+b.h))return false;boxes.push({x,y,w,h});return true;};ctx.textAlign="center";ctx.textBaseline="middle";
  for(const n of order){const p=P.get(n),r=Math.max(2.6,n.r*p.s*1.3);if(p.x<-70||p.y<-70||p.x>B.W+70||p.y>B.H+70||r<1.5)continue;const dep=Math.max(.25,Math.min(1,p.s*1.15)),dim=hi&&!hi.has(n.id);ctx.globalAlpha=dim?.16:dep;

function brainFit(){
  if(!B.nodes.length) return;
  let m=1; for(const n of B.nodes) m=Math.max(m,Math.hypot(n.x,n.y,n.z));
  B.tzoom=Math.max(.3,Math.min(2.4,(Math.min(B.W,B.H)*0.55)/m));
}
function brainLoop(ts){
  requestAnimationFrame(brainLoop);
  if(document.hidden||!$("brain").classList.contains("on")) return;
  brainStep(ts); brainDraw(ts);
  if(B.fit&&--B.fit===0) brainFit();
}
/* ---------- 브리핑 읽어주기 ---------- */
function briefText(){
  const W=tasks.filter(t=>!t.isGroup), open=W.filter(t=>t.status!=="완료");
  const over=open.filter(t=>{const d=dueInfo(t);return d&&d.past;});
  const today=open.filter(t=>{const d=dueInfo(t);return d&&!d.past&&d.diff===0;});
  const soon=open.filter(t=>{const d=dueInfo(t);return d&&!d.past&&d.diff>0&&d.diff<=3;});
  const waiting=open.filter(t=>["wait","hold"].includes(flowOf(t).stage.code));
  const gaps=W.filter(t=>gapsOf(t).length);
  const items=open.flatMap(t=>(t.items||[]).filter(i=>!i.doneAt));
  const h=new Date().getHours();
  const L=[`${h<11?"좋은 아침입니다":h<17?"안녕하세요":"저녁입니다"}. 진행 중인 업무는 ${open.length}건입니다.`];
  if(over.length) L.push(`기한이 지난 업무가 ${over.length}건 있습니다. ${over.slice(0,3).map(t=>t.title).join(", ")}.`);
  if(today.length) L.push(`오늘까지인 업무는 ${today.length}건, ${today.slice(0,3).map(t=>t.title).join(", ")} 입니다.`);
  if(soon.length) L.push(`사흘 안에 기한이 오는 업무가 ${soon.length}건 있습니다.`);
  if(gaps.length) L.push(`확인이 필요한 업무가 ${gaps.length}건 있습니다. ${gaps.slice(0,2).map(t=>`${t.title}은 ${gapsOf(t)[0]}`).join(", ")}.`);
  if(waiting.length) L.push(`회신을 기다리는 보고가 ${waiting.length}건 있습니다.`);
  if(items.length) L.push(`남은 할 일은 ${items.length}개입니다.`);
  if(L.length===1) L.push("급한 것은 없습니다.");
  return L.join(" ");
}
let speaking=false;
function speakBrief(){
  if(!("speechSynthesis" in window)){ toast("이 기기에서는 읽어주기를 쓸 수 없습니다."); return; }
  if(speaking){ speechSynthesis.cancel(); speaking=false; $("speak").classList.remove("speaking"); return; }
  const u=new SpeechSynthesisUtterance(briefText());
  u.lang="ko-KR"; u.rate=1.02;
  const v=(speechSynthesis.getVoices()||[]).find(v=>/ko/i.test(v.lang)); if(v) u.voice=v;
  u.onend=u.onerror=()=>{ speaking=false; $("speak").classList.remove("speaking"); };
  speaking=true; $("speak").classList.add("speaking");
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------- AI에게 물어보기 (복사·붙여넣기) ---------- */
function askSheet(){
  const open=tasks.filter(t=>!t.isGroup&&t.status!=="완료").sort((a,b)=>lastAt(b)-lastAt(a)).slice(0,40);
  const q=`아래는 제 업무 목록입니다. 오늘 무엇부터 해야 할지, 빠진 것이 없는지 짚어 주세요.\n\n오늘: ${fmtFull(Date.now(),false)}\n\n`+
    open.map(t=>{const d=dueInfo(t),f=flowOf(t);return `- ${t.title} | ${d?d.text:"기한 없음"} | ${f.stage.text}${(t.items||[]).filter(i=>!i.doneAt).length?` | 남은 할 일 ${(t.items||[]).filter(i=>!i.doneAt).length}`:""}`;}).join("\n");
  openSheet(`<p class="say">AI에게 물어보기</p>
    <p class="raw" style="margin-top:0">쓰고 계신 ChatGPT·Claude 구독을 그대로 씁니다. 추가 비용이 없습니다. 아래 질문을 복사해 붙여넣고, 받은 답은 필요하면 업무 기록으로 남기세요.</p>
    <textarea class="f" id="askQ" rows="7" readonly>${esc(q)}</textarea>
    <div class="acts">
      <button class="btn" data-close="1">닫기</button>
      <button class="btn" id="askCopy">복사</button>
      <button class="btn" id="askGpt">ChatGPT로 열기</button>
      <button class="btn primary" id="askClaude">Claude로 열기</button></div>`);
  const openWith=base=>{ navigator.clipboard.writeText(q).catch(()=>{}); window.open(base+encodeURIComponent(q.slice(0,7000)),"_blank","noopener"); };
  $("askCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(q); toast("복사했습니다."); }catch{ $("askQ").select(); toast("길게 눌러 복사하세요."); } };
  $("askGpt").onclick=()=>openWith("https://chatgpt.com/?q=");
  $("askClaude").onclick=()=>openWith("https://claude.ai/new?q=");
}
/* ---------- 시트 ---------- */
function openSheet(html){ $("sheet").innerHTML=`<div class="grab"></div>`+html; $("modal").classList.add("on");
  $("sheet").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet); }
function closeSheet(){ $("modal").classList.remove("on"); $("sheet").innerHTML=""; pending=null; }
$("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeSheet(); });

/* ---------- 입력 ---------- */
const omni=$("omni");
omni.addEventListener("input",()=>{ omni.style.height="auto"; omni.style.height=Math.min(omni.scrollHeight,140)+"px"; });
omni.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); submit(); } });
$("send").onclick=submit;
const BRIEF_RE=/^\s*(오늘\s*)?(브리핑|브리핑 ?해줘|읽어줘|오늘 ?뭐 ?해야 ?(하지|돼|해)?|일정 ?알려줘|상황 ?알려줘)\s*[.!?]?\s*$/;
function submit(){
  const v=omni.value.trim(); if(!v) return;
  if(BRIEF_RE.test(v)){ omni.value=""; omni.style.height="auto"; tab="home"; render(); speakBrief(); toast("브리핑을 읽습니다. 다시 누르면 멈춥니다."); return; }
  const q=v.replace(/[?？]/g,"").trim();
  if((/[?？]$/.test(v)||(q.length<=10&&!/\s/.test(q)))&&tasks.some(t=>t.title.includes(q))){
    filter=q; tab="list"; omni.value=""; omni.style.height="auto"; render(); return;
  }
  buildPending(v);
}
$("speak").onclick=()=>{ speakBrief(); if(speaking) toast("브리핑을 읽습니다. 다시 누르면 멈춥니다."); };
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recOn=false;
$("mic").onclick=()=>{
  if(!SR){ toast("이 기기에서는 말로 적기를 쓸 수 없습니다."); return; }
  if(recOn){ rec.stop(); return; }
  rec=new SR(); rec.lang="ko-KR"; rec.interimResults=true; rec.continuous=false;
  const base=omni.value?omni.value.replace(/\s*$/,"")+" ":"";
  rec.onstart=()=>{ recOn=true; $("mic").classList.add("on"); };
  rec.onresult=e=>{ let t=""; for(const r of e.results) t+=r[0].transcript; omni.value=base+t; };
  rec.onerror=()=>toast("말로 적기에 실패했습니다.");
  rec.onend=()=>{ recOn=false; $("mic").classList.remove("on"); if(omni.value.trim()) toast("확인하고 [기록]을 누르세요."); };
  try{ rec.start(); }catch{ toast("말로 적기를 시작하지 못했습니다."); }
};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); });

}
