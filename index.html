<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Work Brain 모바일 v3.5.0</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Work Brain">
<meta name="theme-color" content="#F2F4F8">
<style>
:root{
  --ink:#1D1D1F; --sub:#6E6E73; --faint:#A1A1A6; --line:rgba(60,60,67,.14);
  --glass:rgba(255,255,255,.72); --edge:rgba(255,255,255,.8);
  --blue:#0A84FF; --red:#FF3B30; --orange:#FF9500; --yellow:#FFC400; --green:#34C759; --purple:#AF52DE; --wait:#AEAEB2;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#F2F4F8}
html,body{margin:0;height:100%;width:100%;max-width:100%;color:var(--ink);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{max-width:100vw;overflow-x:hidden;background:
  radial-gradient(45% 30% at 15% 10%,rgba(10,132,255,.12),transparent 70%),
  radial-gradient(40% 30% at 90% 15%,rgba(175,82,222,.10),transparent 70%),
  radial-gradient(45% 35% at 80% 90%,rgba(48,176,199,.10),transparent 70%),#F2F4F8;
  display:flex;flex-direction:column;overflow:hidden}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#F2F2F7; --sub:#98989D; --faint:#6E6E73; --line:rgba(255,255,255,.12);
  --glass:rgba(28,28,30,.72); --edge:rgba(255,255,255,.08); }
  :root:not([data-theme="light"]) html,:root:not([data-theme="light"]) body{background:#0B0B0F}
}
button,input,textarea,select{font:inherit;color:inherit;min-width:0}
input,textarea,select{font-size:16px!important}
img,svg,canvas{max-width:100%}
button{cursor:pointer}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--shadow)}
header{display:flex;flex-direction:column;gap:6px;padding:8px 12px 10px;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(127,127,127,.12);border-radius:11px;padding:3px}
.hbtns .tbtn{padding:7px 4px;text-align:center;border-radius:9px;font-size:.82rem;letter-spacing:-.02em}
.logo{font-weight:700;letter-spacing:.16em;font-size:.7rem;color:var(--sub)}
.hbtns{display:flex;gap:4px}
.tbtn{background:transparent;border:0;border-radius:9px;padding:6px 10px;font-size:.8rem;color:var(--sub)}
.tbtn.on{background:var(--blue);color:#fff}
.sync{font-size:.68rem;color:var(--faint);padding:0 4px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
main.brainmode{overflow:hidden;padding:0;pointer-events:none}
body.space{background:radial-gradient(45% 38% at 20% 25%,rgba(70,60,190,.25),transparent 70%),radial-gradient(38% 30% at 82% 18%,rgba(150,50,160,.18),transparent 72%),radial-gradient(50% 42% at 72% 88%,rgba(20,90,150,.2),transparent 72%),#03040B!important}
:root[data-theme="dark"]{--ink:#E9ECF6;--sub:#9CA3BA;--faint:#6B7189;--line:rgba(255,255,255,.10);--glass:rgba(16,19,34,.62);--edge:rgba(255,255,255,.09)}
:root[data-theme="dark"] html,:root[data-theme="dark"] body{color:var(--ink)}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"] select{
  color-scheme:dark!important;
  background-color:#141827!important;
  color:#E9ECF6!important;
  border-color:rgba(255,255,255,.12)!important;
}
:root[data-theme="dark"] select option{
  background:#141827!important;
  color:#E9ECF6!important;
}
:root[data-theme="dark"] select optgroup{
  background:#0F1220!important;
  color:#9CA3BA!important;
}
:root[data-theme="dark"] select option:checked{
  background:#0A84FF!important;
  color:#FFFFFF!important;
}
#brain{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:3;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
#brain.on{display:block}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,rgba(242,244,248,.88) 45%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bottom{background:linear-gradient(transparent,rgba(11,11,15,.92) 45%)}}
.bottom .omni{margin:0;transition:max-width .2s ease,opacity .2s ease}
body.brain-view .bottom{background:transparent;pointer-events:none}
body.brain-view .bottom .omni{pointer-events:auto;margin-left:auto;margin-right:auto;max-width:190px;opacity:.78}
body.brain-view.input-open .bottom .omni{max-width:100%;opacity:1}
body.brain-view:not(.input-open) .bottom .omni .icon,
body.brain-view:not(.input-open) .bottom .omni .send{display:none}
body.brain-view:not(.input-open) .bottom .omni textarea{min-height:34px;height:34px;max-height:34px;padding:5px 4px;font-size:.88rem!important}
body.brain-view:not(.input-open) .bottom .omni textarea::placeholder{font-size:.84rem}
.icon.speaking{background:rgba(52,199,89,.18);color:var(--green)}
.braintip{position:fixed;left:50%;transform:translateX(-50%);top:calc(92px + env(safe-area-inset-top,0px));z-index:6;white-space:nowrap;
  font-size:.7rem;opacity:.85;color:var(--sub);background:var(--glass);backdrop-filter:blur(10px);padding:5px 12px;border-radius:99px;border:1px solid var(--edge);display:none}
.braintip.on{display:block}
.wrap{width:100%;max-width:720px;min-width:0;margin:0 auto}
.omni{display:flex;gap:8px;align-items:flex-end;border-radius:16px;padding:10px 12px;margin:6px 0 12px}
.omni textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:1rem;min-height:38px;max-height:140px}
.icon{border:0;background:rgba(0,0,0,.05);border-radius:10px;width:36px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.icon.on{background:rgba(255,59,48,.16);color:var(--red)}
.send{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600;flex:none}
.card{border-radius:16px;padding:14px 16px;margin:10px 0}
.say{font-size:1rem;font-weight:600;margin:0 0 8px}
.sec{font-size:.72rem;font-weight:700;color:var(--sub);margin:12px 0 4px;letter-spacing:.02em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:.8rem;color:var(--sub)}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px;font-size:.88rem}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.danger{color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.d{font-size:.76rem;color:var(--sub)}
.raw{font-size:.76rem;color:var(--sub);margin:8px 0 0}
label.fld{display:block;font-size:.74rem;color:var(--sub);margin:8px 0 3px}
input,select,textarea.f{width:100%;background:rgba(127,127,127,.08);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.lamp{display:inline-flex;gap:3px;padding:3px 5px;border-radius:99px;background:#2C2C2E;vertical-align:middle}
.lamp i{width:7px;height:7px;border-radius:50%;background:#48484A;display:block}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:16px;border-radius:99px;background:rgba(127,127,127,.2);color:var(--sub);font-size:.6rem;font-weight:700;vertical-align:middle}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 4px}
.trow:active{background:rgba(127,127,127,.08)}
.ttl{font-size:.95rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{grid-column:2/4;font-size:.75rem;color:var(--sub)}
.ck{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line);font-size:.9rem}
.ck input{width:20px;height:20px;accent-color:var(--blue);flex:none;margin-top:1px}
.ck.done span{color:var(--sub);text-decoration:line-through}
.kind{font-weight:700;font-size:.76rem}
.k지시,.k피드백{color:#C76A00}.k조치,.k완료{color:#248A3D}.k보고{color:#0A64D6}.k위임{color:#8E44C8}.k정정{color:var(--orange)}
details.rec{border-bottom:1px solid var(--line)}
details.rec>summary{list-style:none;padding:9px 2px;cursor:pointer}
details.rec>summary::-webkit-details-marker{display:none}
.rhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rsum{display:block;margin-top:2px;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.rec[open] .rsum{display:none}
.rbody{padding:0 2px 12px;font-size:.92rem;white-space:pre-wrap}
.flow{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:6px 0}
.fl{font-size:.7rem;border:1px solid var(--line);border-radius:8px;padding:2px 7px;color:var(--sub)}
.turn{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px}
.turn.mine{background:rgba(255,149,0,.18);color:#B25E00}
.turn.their{background:rgba(142,142,147,.18);color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:34px 8px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  padding:9px 16px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:0;z-index:10}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.25);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.sheet{width:100%;max-width:640px;min-width:0;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px;max-height:84vh}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px}
</style>

<style id="wb-rich-format-style">
.fmtbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:5px 0 7px}
.fmtbtn{min-width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:rgba(127,127,127,.10);color:inherit;font-weight:700;cursor:pointer}
.fmtbtn:hover{background:rgba(10,132,255,.12);border-color:rgba(10,132,255,.35)}
.fmtbtn[data-wrap="=="]{font-weight:600;text-decoration:underline;text-decoration-thickness:4px;text-decoration-color:rgba(255,196,0,.45);text-underline-offset:-2px}
.fmthint{font-size:.78rem;color:var(--faint)}
.wb-mark{background:rgba(255,196,0,.24);color:inherit;border-radius:3px;padding:0 .12em;box-shadow:inset 0 -1px 0 rgba(255,196,0,.38)}
body.space .wb-mark,:root[data-theme="dark"] .wb-mark{background:rgba(255,196,0,.20);box-shadow:inset 0 -1px 0 rgba(255,214,76,.42)}
.tx strong,.rbody strong,.rec-body strong{font-weight:800}
</style>


<style id="wb-mobile-timeline-pin">
.m-pinbox{margin:8px 0 4px;padding:8px 10px;border-radius:11px;background:rgba(255,184,48,.035);border:1px solid rgba(255,184,48,.085)}
.m-pinhead{font-size:.74rem;font-weight:650;color:var(--sub);margin-bottom:3px;display:flex;align-items:center;gap:7px}
.m-pinhead b{display:inline-block;width:6px;height:6px;border-radius:50%;background:#FFB830;box-shadow:0 0 7px rgba(255,184,48,.18);font-size:0}
.m-pinrow{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;padding:4px 0;font-size:.78rem}
.m-pinrow .pd{color:var(--faint);font-size:.68rem}
.m-pinrow .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtimeline{position:relative;margin-top:4px}
.mtimeline:before{content:"";position:absolute;left:47px;top:7px;bottom:7px;width:1px;background:var(--line)}
.mtimeline details.rec{position:relative;border-bottom:0;padding:0}
.mtimeline details.rec:before{content:"";position:absolute;left:44px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--card);border:1px solid var(--sub);z-index:2}
.mtimeline details.rec>summary{display:grid;grid-template-columns:38px minmax(0,1fr) 13px;gap:10px;padding:8px 0;align-items:start}
.mdate{text-align:right;font-size:.67rem;color:var(--faint);line-height:1.25}
.mrecmain{min-width:0}
.mmeta{font-size:.69rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}
.mtimeline .rsum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;font-size:.86rem;line-height:1.42;margin-top:3px}
.mstar{width:18px;height:18px;min-width:18px;padding:0;border:0;background:transparent;color:var(--faint);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.mstar:before{content:"";width:6px;height:6px;border-radius:50%;border:1px solid currentColor;background:transparent}
.mstar.on{color:#FFB830}
.mstar.on:before{background:#FFB830;border-color:#FFB830;box-shadow:0 0 6px rgba(255,184,48,.16)}
.mstar:active{background:rgba(255,184,48,.06)}
.mtimeline .rbody{margin-left:48px;padding:2px 0 12px;font-size:.90rem;line-height:1.58}
:root[data-theme="dark"] .m-pinbox{background:rgba(255,176,0,.055)}
</style>


<style id="wb-mobile-period-style">
.mperiod{padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.42);backdrop-filter:blur(18px) saturate(135%)}
:root[data-theme="dark"] .mperiod{background:rgba(15,19,35,.52)}
.mprange{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:end}
.mprange label{font-size:.68rem;color:var(--faint);display:flex;flex-direction:column;gap:4px}
.mprange input{font-size:16px!important;min-width:0}
.mpquick{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.mpquick button{border:0;background:rgba(127,127,127,.08);color:var(--sub);border-radius:8px;padding:5px 8px;font-size:.72rem}
.mpsummary{font-size:.73rem;color:var(--sub);margin:8px 0 4px}
.mprow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;padding:9px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.mprow:last-child{border-bottom:0}
.mprow b{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mprow .cnt{font-size:.70rem;color:var(--blue)}
.mprow .sub{grid-column:1/-1;font-size:.70rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>


<style id="wb-mobile-todo-deadline">
.todo-mobile{padding:7px 0;border-bottom:1px solid var(--line)}
.todo-mobile-main{display:flex;gap:9px;align-items:flex-start}
.todo-mobile-main .ck{flex:1;border-bottom:0;padding:0}
.todo-mobile-due{display:flex;align-items:center;gap:6px;margin:5px 0 0 29px}
.todo-mobile-date{height:31px;min-width:128px;padding:2px 7px;border:1px solid var(--line);border-radius:9px;background:rgba(127,127,127,.06);color:var(--sub);font-size:.76rem;color-scheme:inherit}
.todo-pill{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:99px;font-size:.67rem;font-weight:700}
.todo-pill.far{color:var(--sub);background:rgba(127,127,127,.08)}
.todo-pill.watch{color:#B35B00;background:rgba(255,149,0,.11)}
.todo-pill.soon{color:#D8441E;background:rgba(255,90,55,.11)}
.todo-pill.now,.todo-pill.over{color:#FF3B30;background:rgba(255,59,48,.12)}
.todo-mobile.done .todo-mobile-date,.todo-mobile.done .todo-pill{opacity:.42}
.todo-mobile.due-now .ck span,.todo-mobile.due-over .ck span{font-weight:650}
.todo-add-mobile{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:7px;margin-top:7px}
.todo-add-mobile input{min-width:0}
:root[data-theme="dark"] .todo-mobile-date{background:rgba(255,255,255,.045);color:#C8CDDB;color-scheme:dark}
:root[data-theme="dark"] .todo-pill.watch{color:#FFB35A;background:rgba(255,149,0,.08)}
:root[data-theme="dark"] .todo-pill.soon{color:#FF8267;background:rgba(255,90,55,.09)}
:root[data-theme="dark"] .todo-pill.now,:root[data-theme="dark"] .todo-pill.over{color:#FF6860;background:rgba(255,59,48,.10)}
</style>


<style id="wb-mobile-aligned-todo">
.m-home-todo{
  display:grid;
  grid-template-columns:20px minmax(0,1fr) 56px;
  gap:8px;
  align-items:start;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}
.m-home-todo input{width:16px;height:16px;margin-top:2px;accent-color:var(--blue)}
.m-home-main{min-width:0}
.m-home-title{font-size:.91rem;line-height:1.38;overflow-wrap:anywhere}
.m-home-task{margin-top:3px;font-size:.73rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-home-due{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums}
.m-home-date{font-size:.67rem;color:var(--faint);line-height:1}
.m-home-dday{min-width:34px;text-align:center;padding:3px 6px;border-radius:99px;font-size:.66rem;font-weight:750;line-height:1}
.m-home-dday.far{color:var(--sub);background:rgba(127,127,127,.08)}
.m-home-dday.watch{color:#B35B00;background:rgba(255,149,0,.11)}
.m-home-dday.soon{color:#D8441E;background:rgba(255,90,55,.11)}
.m-home-dday.now,.m-home-dday.over{color:#FF3B30;background:rgba(255,59,48,.12)}
.m-home-todo.due-now .m-home-title,.m-home-todo.due-over .m-home-title{font-weight:650}
:root[data-theme="dark"] .m-home-dday.watch{color:#FFB35A;background:rgba(255,149,0,.08)}
:root[data-theme="dark"] .m-home-dday.soon{color:#FF8267;background:rgba(255,90,55,.09)}
:root[data-theme="dark"] .m-home-dday.now,:root[data-theme="dark"] .m-home-dday.over{color:#FF6860;background:rgba(255,59,48,.10)}
</style>


<style id="wb-mobile-todo-edit">
.mtodo-head{display:flex;align-items:flex-start;gap:5px;min-width:0}
.mtodo-text{min-width:0;flex:1}
.mtodo-edit{flex:0 0 auto;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--faint);font-size:.9rem}
.mtodo-edit:active{background:rgba(10,132,255,.08);color:var(--blue)}
.mtodo-edit-wrap{display:flex;gap:6px;width:100%;margin-top:2px}
.mtodo-edit-input{min-width:0;flex:1;height:34px;border:1px solid var(--line);border-radius:9px;background:rgba(127,127,127,.05);color:var(--ink);padding:5px 8px;font:inherit}
.mtodo-edit-save,.mtodo-edit-cancel{height:32px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:rgba(127,127,127,.06);color:var(--ink);font-size:.74rem}
.mtodo-edit-save{color:var(--blue);font-weight:700;background:rgba(10,132,255,.10)}
</style>


<style id="wb-mobile-todo-card-v315">
.todo-mobile{
  padding:10px 0 11px;
}
.todo-mobile-main{
  display:block!important;
  min-width:0;
}
.todo-mobile-main .ck{
  width:100%;
  min-width:0;
}
.todo-mobile-main .ck>input{
  flex:0 0 17px;
}
.mtodo-text{
  display:block!important;
  flex:1 1 auto!important;
  min-width:0!important;
}
.mtodo-head{
  width:100%;

<script>

    return `<div class="m-pinrow"><span class="pd">${esc(d.d.replace(/\([^)]*\)/g,""))}</span><span class="pt">${esc(stripFmt(e.raw).replace(/\s+/g," ").slice(0,80))}</span></div>`;
  }).join("")}${pins.length>4?`<div class="d">외 ${pins.length-4}건</div>`:""}</div>`;
}
function wrapSelection(id,mark){

const pad=n=>String(n).padStart(2,"0");
const DAYS="일월화수목금토";
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=(ts,t=true)=>{const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]})`+(t?` ${pad(d.getHours())}:${pad(d.getMinutes())}`:"");};
const fmtFull=(ts,t=true)=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`+(t?` ${pad(d.getHours())}:${pad(d.getMinutes())}`:"");};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600);}

/* ---------- 해석 ---------- */
const KINDS=["지시","위임","조치","보고","피드백","협의","변경","완료","메모"];
const KIND_LABEL={지시:"지시받음",위임:"맡김",조치:"조치",보고:"보고",피드백:"피드백",협의:"협의",변경:"변경",완료:"완료",메모:"메모",정정:"정정",확인:"확인 메일"};
const CHANNELS=["","구두","메일","전화","메신저","결재","회의","공문","기타"];
const ROLES=["부센터장","센터장","사무국장","본부장","이사장","국장","재단","서울시","구청","주무관"];
const ALL_PERSON="전체";
function parseWhen(text,now=new Date()){
  const today=sod(now); let date=null,hasTime=false,h=null,mi=0; const spans=[]; let m;
  if((m=text.match(/(\d{1,2})\s*(?:\/|월\s*|\.\s*)(\d{1,2})\s*일?/))&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31){
    let y=today.getFullYear(); let d=new Date(y,+m[1]-1,+m[2]);
    if(d<addDays(today,-200)) d=new Date(y+1,+m[1]-1,+m[2]);
    date=d; spans.push(m[0]);
  }else if((m=text.match(/오늘|금일|아까|방금/))){date=today;spans.push(m[0]);}
  else if((m=text.match(/그저께|그제/))){date=addDays(today,-2);spans.push(m[0]);}
  else if((m=text.match(/어제|전날/))){date=addDays(today,-1);spans.push(m[0]);}
  else if((m=text.match(/내일|명일/))){date=addDays(today,1);spans.push(m[0]);}
  else if((m=text.match(/모레/))){date=addDays(today,2);spans.push(m[0]);}
  else if((m=text.match(/(이번\s*주|금주|다음\s*주|차주|지난\s*주)?\s*([일월화수목금토])요일/))){
    const tg=DAYS.indexOf(m[2]),cur=today.getDay(),mb=x=>(x+6)%7; let diff;
    if(m[1]&&/다음|차주/.test(m[1])) diff=7-mb(cur)+mb(tg);
    else if(m[1]&&/지난/.test(m[1])) diff=-7-mb(cur)+mb(tg);
    else if(m[1]) diff=mb(tg)-mb(cur); else diff=(tg-cur+7)%7;
    date=addDays(today,diff); spans.push(m[0]);
  }
  if((m=text.match(/(오전|오후)?\s*(\d{1,2})\s*시(?!간)(?:\s*(\d{1,2})\s*분|\s*(반))?/))){
    h=+m[2]; mi=m[3]?+m[3]:(m[4]?30:0);
    if(m[1]==="오후"&&h<12)h+=12;
    if(!m[1]&&h>=1&&h<=7)h+=12;
    if(h<=23&&mi<60){hasTime=true;spans.push(m[0]);}
  }
  if(hasTime&&!date) date=today;
  if(date&&hasTime){date=new Date(date);date.setHours(h,mi,0,0);}
  return {date,hasTime,spans};
}
function splitWhen(text,now=new Date()){
  const w=parseWhen(text,now); if(!w.date) return {due:null,occ:null,spans:w.spans};
  const dueWord=/까지|마감|기한|전까지|내로|이내/.test(text);
  const future=w.hasTime?w.date>now:sod(w.date)>sod(now);
  const v={date:w.date,hasTime:w.hasTime};
  return (dueWord||future)?{due:v,occ:null,spans:w.spans}:{due:null,occ:v,spans:w.spans};
}
function detectPeople(t,people){
  let to="",from="";
  const names=[...new Set([ALL_PERSON,...(people||[]),...ROLES])].sort((a,b)=>b.length-a.length);
  const q=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  let m=t.match(/@([가-힣A-Za-z0-9]+?)(?:에게|한테|께|님께)/); if(m) to=m[1];
  if(!to) for(const n of names) if(new RegExp(q(n)+"(?:님)?(?:에게|한테|께)").test(t)){to=n;break;}
  m=t.match(/@([가-힣A-Za-z0-9]+)/);
  if(m){const n=m[1].replace(/(에게|한테|께|님|이|가|은|는)$/,""); if(n!==to) from=n;}
  if(!from) for(const n of names) if(n!==to&&t.includes(n)){from=n;break;}
  return {from,to};
}
function detectKind(s,from,to){
  if(/^정정/.test(s)) return "정정";
  if(/보고함|보고했|보고 ?완료|말씀 ?드림|말씀 ?드렸|공유함|공유했|전달함|전달했|상신|결재 ?올림|회신함|회신했/.test(s)) return "보고";
  if(/(완료|끝냈|끝남|끝났|마침|마쳤|제출함|제출했|발송함|발송했|보냈|처리함|처리했|결재 ?남|결재 ?났)/.test(s)) return "완료";
  if(/(바뀌|바꿈|바꿨|변경|연기|미뤄|미뤘|앞당|취소|번복)/.test(s)) return "변경";
  const order=/지시|시킴|시켰|하라고|하래|해달라|요청|달라고|부탁|맡기|맡김|맡겼/.test(s);
  if(to&&!ROLES.includes(to)&&order) return "위임";
  if(order&&from&&from!=="나") return "지시";
  if(order&&to) return "위임";
  if(/회의|협의|논의|면담|통화/.test(s)) return "협의";
  if(from&&ROLES.includes(from)&&!/결과|받음|받았|줌|줬|왔/.test(s)) return "지시";
  return "조치";
}
function detectChannel(t){
  if(/메일|이메일/.test(t))return"메일"; if(/전화|통화/.test(t))return"전화";
  if(/카톡|메신저|문자|톡으로/.test(t))return"메신저"; if(/결재|기안|상신/.test(t))return"결재";
  if(/회의|면담/.test(t))return"회의"; if(/공문/.test(t))return"공문";
  if(/구두|말로|불러서|대면/.test(t))return"구두"; return"";
}
function cleanTitle(t,spans){
  let s=t; for(const sp of spans) s=s.replace(sp," ");
  s=s.replace(/@[가-힣A-Za-z0-9]+/g," ").replace(/(센터장|부센터장|국장|주무관)(님)?(이|가|께서|에게|한테|께)?/g," ")
   .replace(/(구두|메일|이메일|전화|카톡|메신저)(로|으로)?/g," ")
   .replace(/까지|다시|좀|지시함|지시|하라고 ?함|하라고|요청함|요청|맡김/g," ")
   .replace(/\s+/g," ").replace(/^[\s,.·\-]+|[\s,.·\-]+$/g,"").trim();

const STOP=/완료|끝냈|끝남|까지|오늘|내일|모레|어제|요일|다시|했음|했어|함|변경|연기|제출|보냈|처리|보고|지시|요청|센터장|구두|메일|전화|하라고|\?/g;

  const g=new Set(); for(let i=0;i<s.length-1;i++) g.add(s.slice(i,i+2)); if(s.length===1)g.add(s); return g;}
function dice(a,b){if(!a.size||!b.size)return 0;let n=0;for(const x of a)if(b.has(x))n++;return 2*n/(a.size+b.size);}

/* ---------- 상태 ---------- */
let USER=null;

function flowOf(t){

    else if(e.kind==="피드백") ev.push({e,label:e.fb||"피드백"});

  else if(last.kind==="지시") stage={code:"todo",text:"지시 받음 · 조치 필요",turn:"나"};
  else stage={code:"doing",text:reports?`${reports+1}차 보고 준비 중`:"진행 중",turn:"나"};

}
function gapsOf(t){
  if(t.isGroup) return [];
  const g=[],now=Date.now(),day=864e5,es=entriesOf(t.id);
  const dirs=es.filter(e=>e.kind==="지시"||(e.kind==="피드백"&&e.fb==="수정 요청"));
  if(dirs.length){
    const last=dirs[dirs.length-1];
    const after=es.filter(e=>e.occurredAt>=last.occurredAt&&e!==last&&["조치","완료","보고","협의"].includes(e.kind));
    if(t.status!=="완료"&&!after.length&&now-last.occurredAt>2*day) g.push(`${last.kind==="피드백"?"수정 요청":"지시"} 후 조치 기록 없음 (${Math.floor((now-last.occurredAt)/day)}일)`);
  }

const SIG={red:{c:"#FF3B30",t:"#D70015",l:"긴급"},yellow:{c:"#FFC400",t:"#A07800",l:"주의"},green:{c:"#34C759",t:"#248A3D",l:"순조"},wait:{c:"#AEAEB2",t:"#6E6E73",l:"대기"},done:{c:"#D1D1D6",t:"#8E8E93",l:"완료"}};
function signalOf(t){
  if(t.isGroup){
    const kids=tasks.filter(x=>x.parentId===t.id&&!x.isGroup);
    if(!kids.length) return {code:"wait",why:"하위 업무 없음"};
    const order=["red","yellow","green","wait","done"], ss=kids.map(signalOf);
    const worst=order.find(o=>ss.some(x=>x.code===o));
    return {code:worst,why:`하위 업무 ${ss.filter(x=>x.code===worst).length}건 ${SIG[worst].l}`};
  }
  if(t.status==="완료") return {code:"done",why:"완료 기록 있음"};
  const d=dueInfo(t), f=flowOf(t), now=Date.now();
  const mine=f.stage.turn!=="상대"&&t.status!=="대기";
  if(d&&d.past) return {code:"red",why:"기한 지남"};
  if(d&&d.diff<=1&&mine) return {code:"red",why:`기한 ${d.diff<=0?"오늘":"내일"} · 내 차례`};
  const g=gapsOf(t); if(g.length) return {code:"yellow",why:g[0]};
  if(d&&d.diff<=3&&mine) return {code:"yellow",why:`기한 ${d.diff}일 남음`};
  if(!mine) return {code:"wait",why:f.stage.text};
  if(now-lastAt(t)>7*864e5) return {code:"yellow",why:`${Math.floor((now-lastAt(t))/864e5)}일째 기록 없음`};
  return {code:"green",why:f.stage.text};
}
function lamp(t){
  const s=signalOf(t);
  if(s.code==="done") return `<span class="pill">완료</span>`;
  if(s.code==="wait") return `<span class="pill">대기</span>`;
  const on=k=>s.code===k?`style="background:${SIG[k].c};box-shadow:0 0 5px ${SIG[k].c}"`:"";
  return `<span class="lamp"><i ${on("red")}></i><i ${on("yellow")}></i><i ${on("green")}></i></span>`;
}

const ghHeaders=()=>({Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
function ghErr(code){ return {401:"토큰이 맞지 않습니다.",403:"토큰 권한이 모자랍니다. Contents: Read and write 권한을 확인하세요.",404:"저장소를 찾지 못했거나 이 토큰에 접근 권한이 없습니다.",409:"다른 기기가 먼저 올렸습니다. 다시 시도합니다.",422:"브랜치 또는 저장소 설정을 확인하세요."}[code]||`동기화 오류 (${code})`; }
async function ghProbeAccess(){
  const owner=encodeURIComponent(GH.owner), repo=encodeURIComponent(GH.repo), branch=encodeURIComponent(GH.branch||"main");
  const rr=await fetch(`https://api.github.com/repos/${owner}/${repo}?t=${Date.now()}`,{headers:ghHeaders(),cache:"no-store"});
  if(!rr.ok){
    if(rr.status===404) throw new Error("저장소를 찾지 못했거나 토큰이 이 Private 저장소에 접근할 수 없습니다. 사용자 이름·저장소 선택·토큰 권한을 확인하세요.");
    throw new Error(ghErr(rr.status));
  }
  const br=await fetch(`https://api.github.com/repos/${owner}/${repo}/branches/${branch}?t=${Date.now()}`,{headers:ghHeaders(),cache:"no-store"});
  if(br.status===404) throw new Error(`브랜치 '${GH.branch||"main"}'를 찾지 못했습니다.`);
  if(!br.ok) throw new Error(ghErr(br.status));
  return true;
}
async function ghGet(){
  const owner=encodeURIComponent(GH.owner), repo=encodeURIComponent(GH.repo), branch=encodeURIComponent(GH.branch||"main");
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${GH_FILE}?ref=${branch}&t=${Date.now()}`,{headers:ghHeaders(),cache:"no-store"});
  if(r.status===404){ await ghProbeAccess(); return {data:null,sha:null}; }
  if(!r.ok) throw new Error(ghErr(r.status));
  const j=await r.json();
  const text=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")),c=>c.charCodeAt(0)));
  return {data:JSON.parse(text),sha:j.sha};
}
async function ghPut(obj,shaIn){

    content:btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(obj)))),
    sha:shaIn||undefined,branch:GH.branch||"main"});
  const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/contents/${GH_FILE}`,
    {method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},body});

function packUp(){

    entries:entries.map(e=>({...e,images:[],files:(e.files||[]).map(f=>({id:f.id,name:f.name,size:f.size,sha:f.sha,locked:f.locked,mail:f.mail?{subject:f.mail.subject,from:f.mail.from,date:f.mail.date,messageId:f.mail.messageId}:undefined}))})),

function unpack(r){
  if(!r||!Array.isArray(r.tasks)) return {nt:0,ne:0};
  const del={...(state.syncDeleted||{}),...(r.deleted||{})}; state.syncDeleted=del;
  let nt=0,ne=0;
  const tmap=new Map(tasks.map(t=>[t.id,t]));
  for(const raw of r.tasks||[]){
    const rt={...raw};
    if(rt.due&&typeof rt.due==="object"){ rt.dueHasTime=!!rt.due.hasTime; rt.due=new Date(rt.due.iso).getTime(); }
    if(del[rt.id]&&del[rt.id]>=(rt.updatedAt||0)) continue;
    const cur=tmap.get(rt.id);
    if(!cur){ tasks.push(rt); tmap.set(rt.id,rt); nt++; }
    else if((rt.updatedAt||0)>(cur.updatedAt||0)){ Object.assign(cur,rt); nt++; }
  }
  for(const [id,at] of Object.entries(del)){
    const i=tasks.findIndex(t=>t.id===id&&(t.updatedAt||0)<=at);
    if(i>=0){ tasks.splice(i,1); entries=entries.filter(e=>e.taskId!==id); }
  }
  const emap=new Map(entries.map(e=>[e.id,e]));
  for(const re0 of r.entries||[]){
    if(del[re0.taskId]) continue;
    const re={...re0,images:re0.images||[],files:re0.files||[]};
    const cur=emap.get(re.id);
    if(!cur){ entries.push(re); emap.set(re.id,re); ne++; }
    else{
      const rr=(re.rev||[]).length, cr=(cur.rev||[]).length;
      if(rr>cr||(rr===cr&&(re.at||0)>(cur.at||0)&&re.raw!==cur.raw)){ Object.assign(cur,re); ne++; }
      if((re.files||[]).length&&!(cur.files||[]).length) cur.files=re.files;
    }
  }
  entries.sort((a,b)=>a.at-b.at);
  for(const p of (r.people||[])) if(p&&p!=="나"&&p!==ALL_PERSON&&!people.includes(p)) people.push(p);
  const tombMap=new Map((state.tombs||[]).map(t=>[t.id,t]));
  for(const t of (r.tombs||[])) if(t&&t.id&&!tombMap.has(t.id)){ (state.tombs=state.tombs||[]).push(t); tombMap.set(t.id,t); }
  const wp=state.wikiPeople=state.wikiPeople||{};
  for(const [n,v] of Object.entries(r.wikiPeople||{})) if(v&&(!wp[n]||(v.at||0)>(wp[n].at||0))) wp[n]=v;
  state.syncMeta={...(state.syncMeta||{}),...(r.meta||{})};
  return {nt,ne};
}

function brainGraphOutOfDate(){
  if(!B||!Array.isArray(B.nodes)) return true;
  const graphIds=new Set(
    B.nodes
      .filter(n=>n&&(n.type==="task"||n.type==="group")&&n.tid)
      .map(n=>n.tid)
  );
  if(graphIds.size!==tasks.length) return true;
  for(const t of tasks) if(!graphIds.has(t.id)) return true;
  return false;
}

function snapBrainNodesToLayout(){
  if(!B||!Array.isArray(B.nodes)) return;
  for(const n of B.nodes){
    if(Number.isFinite(n.tx)) n.x=n.tx;
    if(Number.isFinite(n.ty)) n.y=n.ty;
    if(Number.isFinite(n.tz)) n.z=n.tz;
    n.vx=0; n.vy=0; n.vz=0;
    n.fresh=false;
  }
}

function rebuildBrainFromCurrentData(reason="sync"){
  if(tab!=="brain" || !B || !B.cv) return;

  // 기존 force 상태를 버리고 현재 tasks/entries만으로 우주를 다시 만든다.
  B.nodes=[];
  B.links=[];
  B.ptr=null;
  B.vrx=0; B.vry=0;
  B.dragging=false;
  B.auto=true;
  B.invisibleFrames=0;
  B.taskInvisibleFrames=0;
  B.lastRecoveryAt=0;
  B.lastTaskRecoveryAt=0;

  brainSync();
  snapBrainNodesToLayout();

  // 브라우저가 레이아웃/캔버스 크기를 반영한 다음 다시 한 번 확정한다.
  requestAnimationFrame(()=>{
    brainFit(true);
    B.fit=0;
    B.lastRecoveryAt=performance.now();
    requestAnimationFrame(()=>{
      snapBrainNodesToLayout();
      brainFit(true);
    });
  });
}

async function syncNow(silent){

      const got=await ghGet();

      state.tasks=tasks;

      state.people=people;

      const newSha=await ghPut(packUp(),got.sha);
      if(newSha!==null){
        sha=newSha;
        state.lastSync=Date.now();

        try{
          localStorage.setItem(LS,JSON.stringify({...state,tasks,entries,people}));
        }catch{}

        const remoteChanged=!!(n.nt||n.ne);
        const needsBrainRebuild=tab==="brain" && (remoteChanged || !silent || brainGraphOutOfDate());

        // 일반 UI는 최신 데이터로 먼저 다시 그린다.
        render();

        // 우주 탭에서는 render()의 일반 brainSync만 믿지 않고,
        // 동기화 직후 최신 데이터 기준으로 force 그래프를 한 번 더 강제 재구축한다.
        if(needsBrainRebuild){
          rebuildBrainFromCurrentData(remoteChanged?"remote-change":"manual-sync");
        }

        if(!silent){
          const graphCount=B&&Array.isArray(B.nodes)
            ? B.nodes.filter(x=>x.type==="task"||x.type==="group").length
            : 0;
          toast(
            remoteChanged
              ? `동기화 완료 · 업무 반영 ${n.nt}건 · 기록 ${n.ne}건`
              : `동기화 완료${tab==="brain"?` · 우주 업무 ${graphCount}개 재확인`:""}`
          );
        }
        break;
      }
    }
  }catch(e){
    if(!silent) toast(e.message||"동기화 실패");
    $("sync").textContent="동기화 오류";
    syncing=false;
    return;
  }

}

function buildPending(raw){
  const f=splitFields(raw), w=splitWhen(f.text), ppl=detectPeople(f.text,people);
  let kind=detectKind(f.text,ppl.from,ppl.to);
  const sc=tasks.filter(t=>!t.isGroup).map(t=>({t,s:dice(grams(f.text),grams(t.title))})).sort((a,b)=>b.s-a.s);
  let target=sc[0]&&sc[0].s>=0.45?sc[0].t:null;
  if(target&&kind==="지시"&&flowOf(target).reports>0&&/수정|다시|보완|반려|승인|통과|보류/.test(f.text)) kind="피드백";
  const cands=sc.filter(x=>x.s>=0.2).slice(0,3).map(x=>x.t.id);
  pending={raw,body:f.text,kind,from:ppl.from||(["지시","피드백"].includes(kind)?"":"나"),to:ppl.to,
    channel:detectChannel(f.text)||(kind==="지시"?"구두":""),fb:kind==="피드백"?fbType(f.text):"",
    occ:w.occ?w.occ.date.getTime():Date.now(),occHasTime:w.occ?w.occ.hasTime:true,
    due:w.due?{iso:w.due.date.getTime(),hasTime:w.due.hasTime}:null,
    title:cleanTitle(f.text,w.spans),evidence:f.evidence,next:f.next,
    targetId:target?target.id:null,cands,isNew:!target};
  openConfirm();
}
function fbType(text){
  if(/승인|통과|컨펌|좋다고/.test(text))return"승인";
  if(/보류|중단|멈춰/.test(text))return"보류";
  if(/수정|다시|보완|반려|고쳐/.test(text))return"수정 요청";
  return"의견";
}
function splitFields(t){
  let text=t,next="",evidence="";
  let m=text.match(/근거\s*[:：]\s*(.+?)(?=\s*다음\s*[:：]|$)/);
  if(m){evidence=m[1].trim();text=text.replace(m[0]," ");}
  m=text.match(/다음\s*[:：]\s*(.+)$/);
  if(m){next=m[1].trim();text=text.slice(0,m.index);}
  return {text:text.replace(/\s+/g," ").trim(),next,evidence};
}

const STARS=[]; (function(){ for(let i=0;i<340;i++){ const u=Math.random()*2-1,t=Math.random()*6.283,R=2200+Math.random()*1200;
  STARS.push({x:R*Math.sqrt(1-u*u)*Math.cos(t),y:R*u,z:R*Math.sqrt(1-u*u)*Math.sin(t),m:Math.random(),ph:Math.random()*6.3,c:Math.random()<.12?"#FFD9B0":Math.random()<.25?"#BFD4FF":"#FFFFFF"}); } })();

function buildDust(){ const n=Math.min(900,120+B.nodes.length*30); if(DUST.length===n) return; DUST=[];
  for(let i=0;i<n;i++){ const arm=(i%2)*Math.PI, rr=Math.pow(Math.random(),.6)*(220+B.nodes.length*8), sp=rr*.012+arm+(Math.random()-.5)*.9;

    const msg=(err&&err.message)?err.message:String(err);
    if(B.drawError!==msg){
      B.drawError=msg;
      console.error("WorkBrain mobile renderer:",err);
      const tip=$("braintip");
      if(tip) tip.textContent=`⚠ 우주 렌더링 오류 · ${msg}`;
    }
  }
}
/* ---------- 브리핑 읽어주기 ---------- */
function briefText(){
  const W=tasks.filter(t=>!t.isGroup), open=W.filter(t=>t.status!=="완료");
  const over=open.filter(t=>{const d=dueInfo(t);return d&&d.past;});
  const today=open.filter(t=>{const d=dueInfo(t);return d&&!d.past&&d.diff===0;});
  const soon=open.filter(t=>{const d=dueInfo(t);return d&&!d.past&&d.diff>0&&d.diff<=3;});
  const waiting=open.filter(t=>["wait","hold"].includes(flowOf(t).stage.code));
  const gaps=W.filter(t=>gapsOf(t).length);
  const items=open.flatMap(t=>(t.items||[]).filter(i=>!i.doneAt));
  const h=new Date().getHours();
  const L=[`${h<11?"좋은 아침입니다":h<17?"안녕하세요":"저녁입니다"}. 진행 중인 업무는 ${open.length}건입니다.`];
  if(over.length) L.push(`기한이 지난 업무가 ${over.length}건 있습니다. ${over.slice(0,3).map(t=>t.title).join(", ")}.`);
  if(today.length) L.push(`오늘까지인 업무는 ${today.length}건, ${today.slice(0,3).map(t=>t.title).join(", ")} 입니다.`);
  if(soon.length) L.push(`사흘 안에 기한이 오는 업무가 ${soon.length}건 있습니다.`);
  if(gaps.length) L.push(`확인이 필요한 업무가 ${gaps.length}건 있습니다. ${gaps.slice(0,2).map(t=>`${t.title}은 ${gapsOf(t)[0]}`).join(", ")}.`);
  if(waiting.length) L.push(`회신을 기다리는 보고가 ${waiting.length}건 있습니다.`);
  if(items.length) L.push(`남은 할 일은 ${items.length}개입니다.`);
  if(L.length===1) L.push("급한 것은 없습니다.");
  return L.join(" ");
}
let speaking=false;
function speakBrief(){
  if(!("speechSynthesis" in window)){ toast("이 기기에서는 읽어주기를 쓸 수 없습니다."); return; }
  if(speaking){ speechSynthesis.cancel(); speaking=false; $("speak").classList.remove("speaking"); return; }
  const u=new SpeechSynthesisUtterance(briefText());
  u.lang="ko-KR"; u.rate=1.02;
  const v=(speechSynthesis.getVoices()||[]).find(v=>/ko/i.test(v.lang)); if(v) u.voice=v;
  u.onend=u.onerror=()=>{ speaking=false; $("speak").classList.remove("speaking"); };
  speaking=true; $("speak").classList.add("speaking");
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------- AI에게 물어보기 (복사·붙여넣기) ---------- */
function askSheet(){
  const open=tasks.filter(t=>!t.isGroup&&t.status!=="완료").sort((a,b)=>lastAt(b)-lastAt(a)).slice(0,40);
  const q=`아래는 제 업무 목록입니다. 오늘 무엇부터 해야 할지, 빠진 것이 없는지 짚어 주세요.\n\n오늘: ${fmtFull(Date.now(),false)}\n\n`+
    open.map(t=>{const d=dueInfo(t),f=flowOf(t);return `- ${t.title} | ${d?d.text:"기한 없음"} | ${f.stage.text}${(t.items||[]).filter(i=>!i.doneAt).length?` | 남은 할 일 ${(t.items||[]).filter(i=>!i.doneAt).length}`:""}`;}).join("\n");
  openSheet(`<p class="say">AI에게 물어보기</p>
    <p class="raw" style="margin-top:0">쓰고 계신 ChatGPT·Claude 구독을 그대로 씁니다. 추가 비용이 없습니다. 아래 질문을 복사해 붙여넣고, 받은 답은 필요하면 업무 기록으로 남기세요.</p>
    <textarea class="f" id="askQ" rows="7" readonly>${esc(q)}</textarea>
    <div class="acts">
      <button class="btn" data-close="1">닫기</button>
      <button class="btn" id="askCopy">복사</button>
      <button class="btn" id="askGpt">ChatGPT로 열기</button>
      <button class="btn primary" id="askClaude">Claude로 열기</button></div>`);
  const openWith=base=>{ navigator.clipboard.writeText(q).catch(()=>{}); window.open(base+encodeURIComponent(q.slice(0,7000)),"_blank","noopener"); };
  $("askCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(q); toast("복사했습니다."); }catch{ $("askQ").select(); toast("길게 눌러 복사하세요."); } };
  $("askGpt").onclick=()=>openWith("https://chatgpt.com/?q=");
  $("askClaude").onclick=()=>openWith("https://claude.ai/new?q=");
}

const BRIEF_RE=/^\s*(오늘\s*)?(브리핑|브리핑 ?해줘|읽어줘|오늘 ?뭐 ?해야 ?(하지|돼|해)?|일정 ?알려줘|상황 ?알려줘)\s*[.!?]?\s*$/;

/* ---------- 한 줄 입력 → 할 일 추가 ---------- */
const TODO_RE=/^\s*(할\s*일|todo|to-?do|투두)\s*[:：]\s*\S|((해|아|어|여|봐)야\s*(함|한다|합니다|해|하나|될|돼|겠다|겠어|겠음|지|하고)|해야지|하기로|잊지\s*말|챙겨야|받아야|보내야|물어봐야|알아봐야|준비하기|정리하기|확인하기|작성하기|만들기|챙기기|보내기|알아보기|물어보기)/;
const TODO_TAIL=[
  [/\s*해야\s*(합니다|한다|함|해|하나|돼|겠다|겠어|겠음|지|하고|하는데)\s*$/,"하기"],
  [/\s*해야지\s*$/,"하기"],
  [/([가-힣])\s*봐야\s*(지|겠다|겠어|겠음|함|한다)\s*$/,"$1보기"],
  [/([가-힣])\s*어야\s*(지|겠다|겠어|겠음|함|한다|해)\s*$/,"$1기"],
  [/([가-힣])\s*아야\s*(지|겠다|겠어|겠음|함|한다|해)\s*$/,"$1기"],
  [/\s*하기로\s*(함|했음|했다)?\s*$/,"하기"],
  [/\s*(할\s*것|할\s*예정|예정)\s*$/,"하기"],
  [/\s*잊지\s*말\s*(것|자|기)\s*$/,""]
];
function tidyTodo(text){
  let v=String(text||"").trim();
  v=v.replace(/^\s*(할\s*일|todo|to-?do|투두)\s*[:：]\s*/i,"").replace(/^[-•·*]\s*/,"");
  const w=parseWhen(v,new Date());
  for(const sp of (w.spans||[])) v=v.replace(sp," ");
  v=v.replace(/\b(내가|나는|내|제가|저는)\s+/g," ").replace(/\s*(까지|안에|내로|전까지)\s*/g," ")
     .replace(/\s*(관련해서|관련하여|관련)\s+/g," ").replace(/\s{2,}/g," ").trim();
  for(const [re,rp] of TODO_TAIL){ if(re.test(v)){ v=v.replace(re,rp); break; } }
  v=v.replace(/\s*(좀|한번|일단|우선)\s+/g," ").replace(/[.。!?\s]+$/,"").replace(/\s{2,}/g," ").trim();
  return v.slice(0,80);
}
let todoP=null;
function openTodoSheet(raw){
  const w=parseWhen(raw,new Date()), due=splitWhen(raw).due;
  todoP={raw,text:tidyTodo(raw),q:"",taskId:null,due:due?`${due.date.getFullYear()}-${pad(due.date.getMonth()+1)}-${pad(due.date.getDate())}`:"",log:true,isNew:false};
  const sc=tasks.filter(t=>!t.isGroup&&t.status!=="완료").map(t=>({t,s:dice(grams(todoP.text),grams(t.title))})).sort((a,b)=>b.s-a.s);
  if(sc[0]&&sc[0].s>=0.3) todoP.taskId=sc[0].t.id;
  renderTodoSheet();
}
function todoList(){
  const open=tasks.filter(t=>!t.isGroup&&t.status!=="완료");
  const q=(todoP.q||"").trim();
  if(q){ const g=grams(q); return open.map(t=>({t,s:Math.max(t.title.includes(q)?1:0,dice(g,grams(t.title)))})).filter(x=>x.s>=.12).sort((a,b)=>b.s-a.s).slice(0,10).map(x=>x.t); }
  const g=grams(todoP.text);
  const sc=open.map(t=>({t,s:dice(g,grams(t.title))})).filter(x=>x.s>=.18).sort((a,b)=>b.s-a.s).map(x=>x.t);
  return [...new Set([...sc,...open.sort((a,b)=>lastAt(b)-lastAt(a))])].slice(0,8);
}
async function downloadRepoFile(path,name,btn){
  if(!GH){ toast("먼저 [더보기 > 기기 간 동기화]를 연결하세요."); return; }
  const old=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="받는 중…"; }
  try{
    const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}?ref=${GH.branch||"main"}`,
      {headers:{...ghHeaders(),Accept:"application/vnd.github.raw"},cache:"no-store"});
    if(!r.ok) throw new Error(r.status===404?"저장소에 파일이 없습니다. PC 에서 동기화를 한 번 돌려 주세요.":`받지 못했습니다 (${r.status})`);
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },4000);
    toast("파일 앱에 저장했습니다.");
  }catch(e){ toast(e.message||"받지 못했습니다."); }
  if(btn){ btn.disabled=false; btn.textContent=old; }
}
function todoChips(){
  return (todoList().map(x=>`<button class="chip ${todoP.taskId===x.id?"sel":""}" data-tdt="${x.id}">${esc(x.title)}</button>`).join("")||'<span class="d">찾는 업무가 없습니다.</span>')
    +`<button class="chip ${todoP.isNew?"sel":""}" data-tdt="">＋ 새 업무</button>`;
}
function bindTodoChips(){
  $("tdChips").querySelectorAll("[data-tdt]").forEach(b=>b.onclick=()=>{
    keepTodo(); const id=b.dataset.tdt; todoP.taskId=id||null; todoP.isNew=!id;
    if(todoP.isNew){ renderTodoSheet(); return; }
    $("tdChips").innerHTML=todoChips(); bindTodoChips(); updateTodoSay();
  });
}
function keepTodo(){
  if(!$("tdText")) return;
  todoP.text=$("tdText").value.trim(); todoP.q=$("tdQ").value; todoP.due=$("tdDue").value; todoP.log=$("tdLog").checked;
  if($("tdTitle")) todoP.title=$("tdTitle").value.trim();
}
function updateTodoSay(){
  const el=$("sheet").querySelector(".say"); if(!el) return;
  const t=todoP.taskId&&byId(todoP.taskId);
  el.innerHTML=t?`「${esc(t.title)}」의 할 일로 넣습니다.`:todoP.isNew?"새 업무를 만들어 넣습니다.":"어느 업무의 할 일인가요?";
}
function renderTodoSheet(){
  const t=todoP.taskId&&byId(todoP.taskId);
  openSheet(`<p class="say">${t?`「${esc(t.title)}」의 할 일로 넣습니다.`:todoP.isNew?"새 업무를 만들어 넣습니다.":"어느 업무의 할 일인가요?"}</p>
    <label class="fld">할 일</label><input id="tdText" value="${esc(todoP.text)}">
    ${todoP.text!==todoP.raw?`<p class="raw" style="margin:4px 0 0">적으신 말: ${esc(todoP.raw)}</p>`:""}
    <label class="fld">업무 찾기</label><input id="tdQ" value="${esc(todoP.q)}" placeholder="업무 이름 일부">
    <div class="row" id="tdChips" style="margin-top:6px">${todoChips()}</div>
    ${todoP.isNew?`<label class="fld">새 업무 이름</label><input id="tdTitle" value="${esc(todoP.title||todoP.text)}">`:""}
    <label class="fld">기한</label><input type="date" id="tdDue" value="${todoP.due}">
    <label class="ck" style="border:0"><input type="checkbox" id="tdLog" ${todoP.log?"checked":""}><span>추진사항에도 "할 일 추가" 기록 남기기</span></label>
    <div class="acts"><button class="btn" data-close="1">취소</button><button class="btn primary" id="tdOk">할 일 추가</button></div>`);
  const keep=keepTodo;
  let tm=null;
  const refresh=()=>{ todoP.q=$("tdQ").value; $("tdChips").innerHTML=todoChips(); bindTodoChips(); };
  $("tdQ").addEventListener("input",()=>{ clearTimeout(tm); tm=setTimeout(refresh,120); });
  $("tdQ").addEventListener("compositionend",refresh);
  bindTodoChips();
  $("tdOk").onclick=async()=>{
    keepTodo();
    if(!todoP.text){ toast("할 일을 적어 주세요."); return; }
    if(!todoP.taskId&&!todoP.isNew){ toast("어느 업무인지 골라 주세요."); return; }
    const now=Date.now();
    let t;
    if(todoP.isNew||!todoP.taskId){
      t={id:uid(),title:(todoP.title||todoP.text).slice(0,40),status:"진행",isGroup:false,parentId:null,due:null,dueHasTime:false,
         items:[],nextAction:"",createdAt:now,updatedAt:now,completedAt:null};
    } else t=byId(todoP.taskId);
    const dueObj=todoP.due?{iso:new Date(todoP.due+"T23:59:59").toISOString(),hasTime:false}:null;
    t.items=[...(t.items||[]),{id:uid(),text:todoP.text,createdAt:now,doneAt:null,due:dueObj}];
    await saveTask(t);
    if(todoP.log) await saveEntry({id:uid(),taskId:t.id,at:now,occurredAt:now,occHasTime:true,
      raw:`할 일 추가: ${todoP.text}${todoP.due?` · 기한 ${todoP.due}`:""}`,kind:"메모",from:"나",to:"",channel:"",evidence:"",fb:""});
    closeSheet(); omni.value=""; omni.style.height="auto"; todoP=null;
    toast(`「${t.title}」에 할 일을 넣었습니다.`); render();
  };
  if(!todoP.focused){ todoP.focused=true; setTimeout(()=>$("tdText")&&$("tdText").focus(),50); }
}

function submit(){
  const v=omni.value.trim(); if(!v) return;
  if(BRIEF_RE.test(v)){ omni.value=""; omni.style.height="auto"; tab="home"; render(); speakBrief(); toast("브리핑을 읽습니다. 다시 누르면 멈춥니다."); return; }
  const q=v.replace(/[?？]/g,"").trim();
  if((/[?？]$/.test(v)||(q.length<=10&&!/\s/.test(q)))&&tasks.some(t=>t.title.includes(q))){
    filter=q; tab="list"; omni.value=""; omni.style.height="auto"; render(); return;
  }
  if(TODO_RE.test(v)){ openTodoSheet(v); return; }
  buildPending(v);
}
$("speak").onclick=()=>{ speakBrief(); if(speaking) toast("브리핑을 읽습니다. 다시 누르면 멈춥니다."); };
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recOn=false;
$("mic").onclick=()=>{
  if(!SR){ toast("이 기기에서는 말로 적기를 쓸 수 없습니다."); return; }
  if(recOn){ rec.stop(); return; }
  rec=new SR(); rec.lang="ko-KR"; rec.interimResults=true; rec.continuous=false;
  const base=omni.value?omni.value.replace(/\s*$/,"")+" ":"";
  rec.onstart=()=>{ recOn=true; $("mic").classList.add("on"); };
  rec.onresult=e=>{ let t=""; for(const r of e.results) t+=r[0].transcript; omni.value=base+t; };
  rec.onerror=()=>toast("말로 적기에 실패했습니다.");
  rec.onend=()=>{ recOn=false; $("mic").classList.remove("on"); if(omni.value.trim()) toast("확인하고 [기록]을 누르세요."); };
  try{ rec.start(); }catch{ toast("말로 적기를 시작하지 못했습니다."); }
};
